<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="<%= BASE_URL %>favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="16x16" href="<%= BASE_URL %>favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="<%= BASE_URL %>favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="<%= BASE_URL %>favicon-192.png">
  <link rel="manifest" href="<%= BASE_URL %>site.webmanifest">
  <link rel="apple-touch-icon" href="<%= BASE_URL %>apple-touch-icon.png">
  <meta name="theme-color" content="#0b1716">
  <title>Simret Paulos — Web Developer & AI Solutions in Grande Prairie, AB</title>
  <meta name="description" content="Web developer and cloud engineer in Grande Prairie, Alberta. I build fast custom websites, Shopify stores and AI assistants for local businesses. AWS Certified Solutions Architect.">
  <link rel="canonical" href="https://simretpaulos.com/">

  <!-- Link previews (LinkedIn, Facebook, Slack, X). These must be in the HTML: those crawlers don't run JavaScript. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Simret Paulos">
  <meta property="og:url" content="https://simretpaulos.com/">
  <meta property="og:title" content="Simret Paulos — Web Developer & AI Solutions">
  <meta property="og:description" content="Custom websites, Shopify stores and AI assistants for Grande Prairie businesses. AWS Certified Solutions Architect.">
  <meta property="og:image" content="https://simretpaulos.com/images/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Simret Paulos, Web Developer and Cloud Engineer in Grande Prairie, AB">
  <meta property="og:locale" content="en_CA">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Simret Paulos — Web Developer & AI Solutions">
  <meta name="twitter:description" content="Custom websites, Shopify stores and AI assistants for Grande Prairie businesses.">
  <meta name="twitter:image" content="https://simretpaulos.com/images/og-image.jpg">

  <!-- Tells Google who this site is about (shown in search results for your name) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Simret Paulos",
    "url": "https://simretpaulos.com/",
    "image": "https://simretpaulos.com/images/og-image.jpg",
    "jobTitle": "Web Developer & Cloud Engineer",
    "description": "Web developer and cloud engineer building custom websites, Shopify stores and AI assistants for businesses in Grande Prairie, Alberta.",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Grande Prairie",
      "addressRegion": "AB",
      "addressCountry": "CA"
    },
    "hasCredential": {
      "@type": "EducationalOccupationalCredential",
      "name": "AWS Certified Solutions Architect – Associate",
      "credentialCategory": "certification",
      "recognizedBy": { "@type": "Organization", "name": "Amazon Web Services" }
    },
    "alumniOf": [
      { "@type": "CollegeOrUniversity", "name": "Bahir Dar University" },
      { "@type": "EducationalOrganization", "name": "InnoTech College" }
    ],
    "knowsAbout": ["Web Development", "Shopify", "Vue.js", "React", "AWS", "Amazon Bedrock", "Retrieval-Augmented Generation", "Cloudflare", "Supabase", "SEO"],
    "sameAs": [
      "https://www.linkedin.com/in/simret-webdev/",
      "https://github.com/simretB05"
    ]
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500&family=Jost:wght@200;300;400;500&display=swap">
</head>

<body>
  <noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled.
        Please enable it to continue.</strong>
  </noscript>
  <div id="app"></div>
  <!-- built files will be auto injected -->
</body>

</html>
