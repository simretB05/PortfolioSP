# Cloudflare Pages project settings (used by `wrangler pages dev` and deploys).
name = "simret-portfolio"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# Database for contact form messages. Create it with:
#   npx wrangler d1 create simret-portfolio-messages
# then paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "simret-portfolio-messages"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
